name: catalog-publish

# Publish immutable product catalog snapshots to R2 after merge to main.
# Standalone (not part of ci.yml). Pack job has no secrets; publish job
# uses the same Cloudflare R2 release credentials as DSH bootstrap.

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "design-templates/**"
      - "design-systems/**"
      - "craft/**"
      - "templates/live-artifacts/**"
      - "plugins/**"
      - "data/plugin-previews/**"
      - "tools/release/src/catalog/**"
      - "tools/release/src/storage/publish-catalog.ts"
      - "tools/release/package.json"
      - ".github/workflows/catalog-publish.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-publish
  cancel-in-progress: false

jobs:
  pack:
    name: export render pack
    if: github.repository == 'nexu-io/open-design'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      source_commit: ${{ steps.meta.outputs.source_commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install zstd
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Build tools-release
        run: pnpm --filter @open-design/tools-release build

      - name: Meta
        id: meta
        run: echo "source_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Export catalog
        env:
          CATALOG_SOURCE_COMMIT: ${{ steps.meta.outputs.source_commit }}
          CATALOG_STAGING_DIR: .tmp/catalog-snapshot
        run: pnpm exec tools-release export-catalog

      - name: Install Playwright Chromium
        run: pnpm --filter @open-design/tools-release exec playwright install --with-deps chromium

      - name: Render previews
        env:
          CATALOG_SOURCE_COMMIT: ${{ steps.meta.outputs.source_commit }}
          CATALOG_STAGING_DIR: .tmp/catalog-snapshot
        run: pnpm exec tools-release render-catalog-previews

      - name: Pack catalog
        env:
          CATALOG_SOURCE_COMMIT: ${{ steps.meta.outputs.source_commit }}
          CATALOG_STAGING_DIR: .tmp/catalog-snapshot
        run: pnpm exec tools-release pack-catalog

      - name: Upload snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: catalog-snapshot
          path: .tmp/catalog-snapshot
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish to R2
    needs: pack
    if: github.repository == 'nexu-io/open-design'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build tools-release
        run: pnpm --filter @open-design/tools-release build

      - name: Download snapshot artifact
        uses: actions/download-artifact@v4
        with:
          name: catalog-snapshot
          path: .tmp/catalog-snapshot

      - name: Publish catalog
        env:
          CATALOG_SOURCE_COMMIT: ${{ needs.pack.outputs.source_commit }}
          CATALOG_STAGING_DIR: .tmp/catalog-snapshot
          RELEASE_PUBLIC_ORIGIN: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
          RELEASE_STORAGE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
          RELEASE_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
          RELEASE_STORAGE_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_RELEASES_URL }}
          RELEASE_STORAGE_BUCKET: ${{ secrets.CLOUDFLARE_R2_RELEASES_BUCKET }}
          RELEASE_STORAGE_REGION: auto
          RELEASE_BRANCH: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ needs.pack.outputs.source_commit }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_WORKFLOW: ${{ github.workflow }}
        run: pnpm exec tools-release publish-catalog
