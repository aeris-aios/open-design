<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="OpenDesign — an open-source native AI creation workspace." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2311120f'/%3E%3Cpath d='M8 16 16 8l8 8-8 8z' fill='none' stroke='%23b8f443' stroke-width='2'/%3E%3C/svg%3E" />
    <title>OpenDesign — Design anything with your AI team</title>
    <script>
      const reviewUrl = window.location.href
      window.history.replaceState({}, '', '/pricing?review=pricing')
      window.addEventListener('DOMContentLoaded', () => {
        const restoreReviewUrl = () => {
          if (!document.querySelector('.pricing-decision-page')) return false
          window.history.replaceState({}, '', reviewUrl)
          return true
        }

        if (restoreReviewUrl()) return

        const observer = new MutationObserver(() => {
          if (restoreReviewUrl()) observer.disconnect()
        })

        observer.observe(document.getElementById('root'), { childList: true, subtree: true })
      }, { once: true })
    </script>
    <script type="module" crossorigin src="/pricing-e-final/assets/index-C7mpUWvD.js"></script>
    <link rel="stylesheet" crossorigin href="/pricing-e-final/assets/index-Dqk8N5w0.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
